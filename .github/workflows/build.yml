name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with MSVC
        shell: cmd
        working-directory: src
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          rc /nologo resource.rc
          cl /nologo /O2 /MT /utf-8 /DUNICODE /D_UNICODE main.cpp resource.res /link /SUBSYSTEM:WINDOWS /OUT:JEVILUninstaller.exe

      - name: Show build output
        shell: cmd
        working-directory: src
        run: dir *.exe

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: JEVILUninstaller-unsigned
          path: src/JEVILUninstaller.exe

      # ---------------------------------------------------------------
      # SignPath Foundation signing (only on version tags).
      # Enabled after the project is accepted:
      #   1. Install the SignPath GitHub App for this repository
      #   2. Create a Project and a release signing policy in SignPath
      #   3. Add secret SIGNPATH_API_TOKEN and replace the slugs below
      # ---------------------------------------------------------------
      - name: Sign with SignPath Foundation
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 'REPLACE_WITH_YOUR_ORGANIZATION_ID'
          project-slug: 'jevil-uninstaller'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'release'
          github-artifact-name: 'JEVILUninstaller-unsigned'
          wait-for-completion: true
          output-artifact-directory: src/signed

      - name: Prepare release folder
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          if (Test-Path src/signed/JEVILUninstaller.exe) {
            Copy-Item src/signed/JEVILUninstaller.exe release/JEVILUninstaller.exe -Force
          } else {
            Copy-Item src/JEVILUninstaller.exe release/JEVILUninstaller.exe -Force
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/JEVILUninstaller.exe
